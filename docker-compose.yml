services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
  migrations:
    build: .
    image: ask_sg:latest
    command: alembic upgrade head
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
  ingest:
    build: .
    image: ask_sg:latest
    command: python -m ask_sg.scripts.ingest_hdb_data
    env_file: .env.docker
    volumes:
      - ./data:/app/data:ro
    profiles: ["tools"]
    depends_on:
      migrations:
        condition: service_completed_successfully
  api:
    build: .
    image: ask_sg:latest
    ports:
      - "8000:8000"
    env_file: .env.docker
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:
  pgdata: