name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      # - 'docs/**'
jobs:
  eval: 
    name: RAGAS Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
    - name: Install dependencies
      run: uv sync --frozen
    - name: Test with pytest
      env:
        OLLAMA_BASE_URL: ${{ secrets.OLLAMA_TUNNEL_URL }}/v1
        DATABASE_URL: ${{ secrets.DATABASE_TUNNEL_URL }}
        OLLAMA_EMBEDDING_MODEL_BASE_URL: ${{ secrets.OLLAMA_EMBEDDING_MODEL_BASE_URL }}
        OLLAMA_EMBEDDING_MODEL: ${{ secrets.OLLAMA_EMBEDDING_MODEL }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      run: uv run pytest tests/evals/test_golden_set.py
  deploy:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service acb10455-8a55-453f-8759-0185bec2e839
