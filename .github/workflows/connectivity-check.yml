name: connectivity-check
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping ollama
        run: 'curl -sfL -H "ngrok-skip-browser-warning: true" "${{ secrets.OLLAMA_TUNNEL_URL }}"'
      - name: ping postgres
        run: |
          sudo apt-get install -y postgresql-client
          pg_isready -d "${{ secrets.DATABASE_TUNNEL_URL }}"
